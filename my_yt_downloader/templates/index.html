<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader Web</title>
    <style>
        :root[data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --input-bg: #2a2a2a;
            --input-border: #444444;
            --button-bg: #0d6efd;
            --button-hover: #0b5ed7;
            --toggle-bg: #333333;
            --option-bg: #2a2a2a;
            --option-border: #444444;
            --option-active-bg: #0d6efd;
            --option-active-border: #0d6efd;
            --option-active-text: #ffffff;
        }

        :root[data-theme="light"] {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --button-bg: #007bff;
            --button-hover: #0056b3;
            --toggle-bg: #e4e6eb;
            --option-bg: #f8f9fa;
            --option-border: #dddddd;
            --option-active-bg: #007bff;
            --option-active-border: #007bff;
            --option-active-text: #ffffff;
        }

        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            margin: 0; 
            position: relative;
            transition: background-color 0.3s, color 0.3s;
        }

        .card { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            transition: background 0.3s, box-shadow 0.3s;
        }

        /* ปุ่มสวิตช์มุมขวาบน */
        .theme-switch-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-label {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            user-select: none;
        }

        .theme-switch {
            display: inline-block;
            height: 24px;
            position: relative;
            width: 48px;
        }

        .theme-switch input { display: none; }

        .slider {
            background-color: var(--toggle-bg);
            bottom: 0; cursor: pointer; left: 0;
            position: absolute; right: 0; top: 0;
            transition: .4s; border-radius: 24px;
        }

        .slider:before {
            background-color: #ffffff;
            bottom: 3px; content: ""; height: 18px; left: 3px;
            position: absolute; transition: .4s; width: 18px;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: #0d6efd; }
        input:checked + .slider:before { transform: translateX(24px); }

        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border: 1px solid var(--input-border); 
            border-radius: 8px; 
            background-color: var(--input-bg);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        /* UI ปุ่มเลือก MP3 / MP4 */
        .format-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .format-option {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--option-border);
            border-radius: 8px;
            background-color: var(--option-bg);
            color: var(--text-color);
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease-in-out;
            user-select: none;
        }

        .format-option:hover {
            border-color: var(--button-bg);
        }

        .format-option.active {
            background-color: var(--option-active-bg);
            border-color: var(--option-active-border);
            color: var(--option-active-text);
        }

        .download-btn { 
            width: 100%;
            background-color: var(--button-bg); 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .download-btn:hover { 
            background-color: var(--button-hover); 
        }

        #status { 
            margin-top: 15px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

<div class="theme-switch-wrapper">
    <span class="theme-label" id="theme-text">DARK</span>
    <label class="theme-switch" for="checkbox">
        <input type="checkbox" id="checkbox" />
        <div class="slider"></div>
    </label>
</div>

<div class="card">
    <h2>YouTube Downloader</h2>
    <input type="text" id="url" placeholder="วางลิงก์ YouTube ที่นี่...">
    
    <!-- UI ปุ่มกดเลือก MP3 / MP4 -->
    <div class="format-selector">
        <div class="format-option active" onclick="selectFormat('mp3', this)">
            🎵 MP3 (เสียง)
        </div>
        <div class="format-option" onclick="selectFormat('mp4', this)">
            🎬 MP4 (วิดีโอ)
        </div>
    </div>

    <button class="download-btn" onclick="startDownload()">ดาวน์โหลด</button>
    <div id="status"></div>
</div>

<script>
// ตัวแปรเก็บฟอร์แมตที่เลือก (ค่าเริ่มต้น mp3)
let selectedFormat = 'mp3';

function selectFormat(format, element) {
    selectedFormat = format;
    document.querySelectorAll('.format-option').forEach(opt => opt.classList.remove('active'));
    element.classList.add('active');
}

// จัดการสวิตช์เปลี่ยนธีม
const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
const themeText = document.getElementById('theme-text');
const currentTheme = localStorage.getItem('theme') || 'dark';

document.documentElement.setAttribute('data-theme', currentTheme);

if (currentTheme === 'light') {
    toggleSwitch.checked = true;
    themeText.innerText = 'LIGHT';
} else {
    themeText.innerText = 'DARK';
}

function switchTheme(e) {
    if (e.target.checked) {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        themeText.innerText = 'LIGHT';
    } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeText.innerText = 'DARK';
    }    
}

toggleSwitch.addEventListener('change', switchTheme, false);

// ฟังก์ชันดาวน์โหลด
async function startDownload() {
    const url = document.getElementById('url').value;
    const format = selectedFormat;
    const status = document.getElementById('status');

    if (!url) {
        alert('กรุณากรอก URL');
        return;
    }

    status.innerText = "กำลังประมวลผลและดาวน์โหลด...";

    try {
        const response = await fetch('/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url, format })
        });

        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error || 'เกิดข้อผิดพลาด');
        }

        let filename = format === 'mp3' ? 'audio.mp3' : 'video.mp4';
        const rawFilename = response.headers.get('X-Filename');
        if (rawFilename) {
            filename = decodeURIComponent(rawFilename);
        }

        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        status.innerText = "ดาวน์โหลดสำเร็จ!";
    } catch (e) {
        status.innerText = "ข้อผิดพลาด: " + e.message;
    }
}
</script>

</body>
</html>
