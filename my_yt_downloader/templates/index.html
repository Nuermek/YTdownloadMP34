<!DOCTYPE html>

<html lang="th">

<head>

    <meta charset="UTF-8">

    <title>YouTube Downloader Web</title>

    <style>

        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }

        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }

        input[type="text"] { width: 90%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; }

        select, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; margin: 5px; cursor: pointer; }

        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; }

        button:hover { background-color: #0056b3; }

        #status { margin-top: 15px; font-weight: bold; }

    </style>

</head>

<body>



<div class="card">

    <h2>YouTube Downloader</h2>

    <input type="text" id="url" placeholder="วางลิงก์ YouTube ที่นี่...">

    <br>

    <select id="format">

        <option value="mp3">MP3 (ไฟล์เสียง)</option>

        <option value="mp4">MP4 (วิดีโอ)</option>

    </select>

    <button onclick="startDownload()">ดาวน์โหลด</button>

    <div id="status"></div>

</div>



<script>

async function startDownload() {

    const url = document.getElementById('url').value;

    const format = document.getElementById('format').value;

    const status = document.getElementById('status');



    if (!url) {

        alert('กรุณากรอก URL');

        return;

    }



    status.innerText = "กำลังประมวลผลและดาวน์โหลด...";



    try {

        const response = await fetch('/download', {

            method: 'POST',

            headers: { 'Content-Type': 'application/json' },

            body: JSON.stringify({ url, format })

        });



        if (!response.ok) {

            const err = await response.json();

            throw new Error(err.error || 'เกิดข้อผิดพลาด');

        }



        // ดึงชื่อไฟล์จาก Custom Header X-Filename และแปลงรหัสภาษาไทยกลับคืน

        let filename = format === 'mp3' ? 'audio.mp3' : 'video.mp4';

        const rawFilename = response.headers.get('X-Filename');

        if (rawFilename) {

            filename = decodeURIComponent(rawFilename);

        }



        const blob = await response.blob();

        const downloadUrl = window.URL.createObjectURL(blob);

        const a = document.createElement('a');

        a.href = downloadUrl;

        a.download = filename; // ได้ชื่อภาษาไทยจริงของคลิป

        document.body.appendChild(a);

        a.click();

        a.remove();

        status.innerText = "ดาวน์โหลดสำเร็จ!";

    } catch (e) {

        status.innerText = "ข้อผิดพลาด: " + e.message;

    }

}

</script>



</body>

</html>
